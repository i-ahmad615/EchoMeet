<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoMeet - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="auth-container">
        <div class="auth-card glass-container">
            <a href="/" class="btn-secondary auth-back-link" aria-label="Back to home page">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            <div class="auth-header">
                <i class="fas fa-comments"></i>
                <h2>EchoMeet</h2>
                <p>Sign In to meet strangers</p>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary btn-block">Login</button>
            </form>
            
            <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
    
    <script src="three-bg.js"></script>
    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (data.success) {
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = '/dashboard';
            } else {
                alert('Login failed: ' + data.error);
            }
        };
    </script>
</body>
</html>
